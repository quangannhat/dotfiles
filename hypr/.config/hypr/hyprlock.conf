general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    color = rgba(1a1a1aee)
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(33ccffee)
    inner_color = rgba(26, 26, 26, 0.8)
    font_color = rgb(224, 224, 224)
    fade_on_empty = false
    placeholder_text = <span foreground="##808080">Password...</span>
    hide_input = false
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff6b6bee)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi $USER
    color = rgba(51, 204, 255, 1)
    font_size = 18
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(224, 224, 224, 1)
    font_size = 90
    font_weight = bold
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(160, 160, 160, 1)
    font_size = 20
    position = 0, 100
    halign = center
    valign = center
}
